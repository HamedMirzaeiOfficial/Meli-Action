name: Video Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the video'
        required: true
        type: string

      output_folder:
        description: 'Folder where the video will be saved'
        required: false
        type: string
        default: 'downloads'

      quality:
        description: 'yt-dlp format selector'
        required: true
        type: string
        default: 'bestvideo[height<=720]+bestaudio/best[ext=mp4]/best'

      archive_name:
        description: 'Base name for RAR archive'
        required: false
        type: string
        default: 'video'

permissions:
  contents: write

jobs:
  download-and-maybe-split:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg bc rar

      # OPTIONAL: اگر cookies داری اینو فعال کن
      #
      # - name: Create cookies file
      #   run: |
      #     echo "${{ secrets.PH_COOKIES }}" > cookies.txt

      - name: Download video
        id: download
        shell: bash
        run: |
          set -e

          FOLDER="${{ github.event.inputs.output_folder }}"
          mkdir -p "$FOLDER"

          MARKER=$(date +"%Y-%m-%d %H:%M:%S")

          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do

            echo "======================================="
            echo "Download attempt $((RETRY_COUNT+1))/$MAX_RETRIES"
            echo "======================================="

            yt-dlp \
              --verbose \
              --newline \
              --no-color \
              --geo-bypass \
              --retries 10 \
              --fragment-retries 20 \
              --merge-output-format mp4 \
              -f "${{ github.event.inputs.quality }}" \
              -o "./$FOLDER/%(uploader)s - %(title)s - %(id)s.%(ext)s" \
              "${{ github.event.inputs.url }}"

            EXIT_CODE=$?

            if [ $EXIT_CODE -eq 0 ]; then

              NEW_FILE=$(find "$FOLDER" -type f -newermt "$MARKER" | head -n 1)

              if [ -n "$NEW_FILE" ]; then
                echo "Download succeeded:"
                echo "$NEW_FILE"

                SUCCESS=true
                break
              else
                echo "yt-dlp exited successfully but no file was found."
              fi

            else
              echo "Download failed with exit code $EXIT_CODE"
            fi

            RETRY_COUNT=$((RETRY_COUNT+1))

            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Waiting 5 seconds before retry..."
              sleep 5
            fi

          done

          if [ "$SUCCESS" = false ]; then
            echo "All download attempts failed."
            exit 1
          fi

          FILENAME=$(basename "$NEW_FILE")
          SIZE_BYTES=$(stat -c %s "$NEW_FILE")

          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "size_bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT

          echo "Downloaded file:"
          echo "$FILENAME"

          echo "Size:"
          echo "$SIZE_BYTES bytes"

      - name: Split if file exceeds 99 MB
        id: split
        shell: bash
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          FILENAME="${{ steps.download.outputs.filename }}"
          SIZE_BYTES="${{ steps.download.outputs.size_bytes }}"

          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)

          THRESHOLD_MB=99

          cd "$FOLDER"

          if (( $(echo "$SIZE_MB > $THRESHOLD_MB" | bc -l) )); then

            echo "File exceeds ${THRESHOLD_MB} MB"
            echo "Creating split RAR archive..."

            RANDOM_HEX=$(openssl rand -hex 3)

            ARCHIVE_NAME="${{ github.event.inputs.archive_name }}_${RANDOM_HEX}"

            rar a -v95m -m5 -ep1 "${ARCHIVE_NAME}.rar" "$FILENAME"

            rm "$FILENAME"

            echo "split_done=true" >> $GITHUB_OUTPUT

            echo "RAR parts created:"
            ls -lh "${ARCHIVE_NAME}.part"*.rar

          else

            echo "File size is below threshold."
            echo "Keeping original file."

            echo "split_done=false" >> $GITHUB_OUTPUT

          fi

      - name: Commit and push files
        shell: bash
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$FOLDER/"

          git diff --cached --quiet && echo "No changes to commit." && exit 0

          git commit -m "Add downloaded video(s)"

          # Fetch latest changes from remote and rebase to avoid push rejection
          git fetch origin main
          git rebase origin/main

          # Push the rebased commit
          git push origin main
